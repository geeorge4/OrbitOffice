<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KalibriOffice</title>
<style>
:root{--accent:#315bc6;--soft:#eaf0ff;--ink:#243047}*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:var(--ink);font:14px 'Segoe UI',sans-serif}button,input,select{font:inherit}button{border:0;border-radius:7px;background:transparent;color:inherit;padding:9px 13px;cursor:pointer;transition:background .18s,transform .18s}button:hover{background:var(--soft)}button:active{transform:scale(.96)}button:focus-visible{outline:2px solid var(--accent)}.top{height:58px;display:flex;align-items:center;gap:16px;padding:0 22px;background:white;border-bottom:1px solid #e3e7ef}.logo{font-size:20px;font-weight:700;letter-spacing:-.7px;color:var(--accent)}.fileName{border:0;background:#f4f6fa;padding:8px 12px;border-radius:6px;width:240px}.saved{font-size:12px;color:#748198}.switch{margin-left:auto;display:flex;background:#f3f5f9;border-radius:9px;padding:3px}.switch .active{background:white;box-shadow:0 2px 6px #17264718;color:var(--accent)}.tabs{display:flex;padding:4px 20px 0;background:white;gap:8px}.tabs .active{color:var(--accent);border-bottom:3px solid var(--accent);border-radius:6px 6px 0 0}.ribbon{background:white;margin:0 12px;border-radius:0 0 12px 12px;min-height:104px;display:flex;align-items:stretch;padding:10px;box-shadow:0 3px 9px #1b325a08;gap:8px}.group{border-right:1px solid #e7eaf0;padding:0 14px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;position:relative;padding-bottom:20px}.group label{position:absolute;bottom:0;left:0;width:100%;font-size:11px;color:#7b8495;text-align:center}.group select{border:1px solid #dce1ea;border-radius:5px;padding:6px;background:white}.primary{background:var(--accent);color:white}.primary:hover{background:#294ea9;color:white}.work{height:calc(100vh - 226px);overflow:auto;padding:30px;animation:appear .25s ease}.page{margin:auto;max-width:820px;min-height:1050px;background:white;box-shadow:0 5px 30px #18284612;padding:80px 86px;outline:none;font:16px/1.65 Calibri,'Segoe UI',sans-serif;color:#202631}.page h1{font-size:36px;line-height:1.2}.page h2{font-size:25px}.page table{border-collapse:collapse;width:100%}.page td{border:1px solid #a8b0bd;padding:8px}.status{position:fixed;bottom:0;left:0;right:0;height:28px;background:white;border-top:1px solid #dde3ed;display:flex;align-items:center;padding:0 20px;font-size:11px;color:#68748a;gap:25px}.status span:last-child{margin-left:auto}.gridwrap{background:white;overflow:auto;height:100%;border:1px solid #dbe2ec;border-radius:8px}table.grid{border-collapse:collapse;table-layout:fixed}table.grid th{background:#f5f7fa;color:#65738a;font-weight:400;min-width:105px;height:26px;border:1px solid #e1e6ee;position:sticky;top:0;z-index:1}.grid th:first-child{min-width:40px}.grid td{border:1px solid #e4e8ef;height:28px;min-width:105px;padding:3px 8px;outline:none;white-space:nowrap;overflow:hidden;max-width:105px}.grid td.sel{outline:2px solid #19805c;outline-offset:-2px;background:#eaf7f1}.formula{display:flex;background:white;margin:12px 0 8px;border-radius:6px;border:1px solid #dce3ec;align-items:center}.formula b{padding:8px 16px;width:80px}.formula input{border:0;outline:none;padding:8px;flex:1}.slides{display:flex;gap:28px;height:100%}.thumbs{width:180px;flex-shrink:0;overflow:auto}.thumb{background:white;padding:14px;margin-bottom:12px;border:2px solid transparent;border-radius:8px;cursor:pointer}.thumb.active{border-color:var(--accent)}.thumb small{display:block;margin-bottom:6px;color:#8290a3}.canvas{aspect-ratio:16/9;background:#234c75;color:white;margin:auto;width:min(100%,960px);padding:7%;box-shadow:0 8px 32px #18284622;border-radius:2px;animation:appear .25s}.canvas h1{font-size:42px;line-height:1.15;margin-top:0;outline:none}.canvas .body{font-size:24px;white-space:pre-wrap;outline:none;min-height:150px}.slideArea{flex:1;display:flex;align-items:center}.toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#253650;color:white;border-radius:10px;box-shadow:0 5px 20px #0002;animation:appear .2s;z-index:20}.overlay{position:fixed;inset:0;background:#101d32ef;z-index:30;display:flex;align-items:center;padding:5vw}.overlay .canvas{width:100%;max-width:none}.overlay .close{position:absolute;right:18px;top:15px;color:white}.hint{color:#7e8999;font-size:12px}.group input[type=color]{width:34px;height:30px;border:0;background:white} @keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media print{.top,.tabs,.ribbon,.status,.thumbs,.formula{display:none!important}.work{height:auto;overflow:visible;padding:0}.page{box-shadow:none;max-width:none;padding:20px}.canvas{box-shadow:none}body{background:white}}

.windowControls{display:flex;align-items:center;gap:0;margin-left:4px;flex-shrink:0}.windowControls button{border-radius:0;width:38px;height:34px;padding:0;font-size:18px}.windowControls .windowClose:hover{background:#c42b1c;color:white}.logo{flex-shrink:0;user-select:none;cursor:move}.top{gap:10px;padding-right:8px}.fileName{min-width:100px;width:190px}.saved{white-space:nowrap}@media(max-width:1150px){.saved{display:none}.switch button{padding:9px 8px}}@media print{.windowControls{display:none!important}}

.ribbon{overflow-x:auto;flex-shrink:0}.group{flex-shrink:0}.toolsDialog{border:1px solid #dce3ec;border-radius:15px;padding:26px;width:480px;color:#243047;box-shadow:0 20px 80px #152a4540}.toolsDialog h2{margin-top:0}.toolsDialog label{display:block;margin:14px 0}.toolsDialog input:not([type=checkbox]),.toolsDialog select,.toolsDialog textarea{display:block;width:100%;margin-top:6px;padding:9px;border:1px solid #cbd5e2;border-radius:6px;font:inherit}.dialogActions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.toolsDialog::backdrop{background:#18284655}
</style>
<div class="top"><div class="logo pywebview-drag-region" id="brand" title="Перетащи, чтобы переместить окно">◉ Kalibri Write</div><input class="fileName" id="name" aria-label="Имя документа" value="Новый документ"><span class="saved" id="saved">Сохраняется на компьютере</span><button onclick="showSettings()" aria-label="Настройки">⚙ Настройки</button><div class="switch" title="Открыть отдельное окно"><button data-kind="write" onclick="switchKind('write')">Документы</button><button data-kind="sheet" onclick="switchKind('sheet')">Таблицы</button><button data-kind="slides" onclick="switchKind('slides')">Презентации</button></div><div class="windowControls"><button onclick="windowAction('minimize')" aria-label="Свернуть" title="Свернуть">−</button><button onclick="windowAction('toggle_maximize')" aria-label="Развернуть или восстановить" title="Развернуть / восстановить">□</button><button class="windowClose" onclick="windowAction('close')" aria-label="Закрыть окно" title="Закрыть">×</button></div></div>
<div class="tabs" id="tabs"></div><div class="ribbon" id="ribbon"></div><main class="work" id="work"></main><div class="status"><span id="info"></span><span>Ctrl+S — сохранить · Ctrl+O — открыть</span><span id="mode">KalibriOffice 1.2.0</span></div>
<script>
const $=id=>document.getElementById(id);const initialKind=window.ORBIT_KIND||location.hash.slice(1);let kind=['write','sheet','slides'].includes(initialKind)?initialKind:'write',tab='Главная',idx=0,selected='A1',timer,ready=false;const documents={write:{kind:'write',name:'Новый документ',html:'<h1>Каждая идея начинается<br>с чистого листа.</h1><p>Напиши здесь свою историю.</p>'},sheet:{kind:'sheet',name:'Новая таблица',cells:{}},slides:{kind:'slides',name:'Новая презентация',slides:[{title:'Большие идеи.\nЯсные мысли.',body:'Нажми на текст, чтобы начать свою презентацию',color:'#234c75'}]}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function windowAction(action){if(!ready)return;try{if(action==='close'){capture();await pywebview.api.autosave(documents);}await pywebview.api[action]();}catch(e){toast('Не удалось выполнить действие: '+e.message)}}
function toast(s){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),4500)}
function capture(){let d=documents[kind];d.name=$('name').value||'Без названия';if(kind==='write'&&$('editor'))d.html=$('editor').innerHTML;if(kind==='slides'&&$('slideTitle')){d.slides[idx].title=$('slideTitle').innerText;d.slides[idx].body=$('slideBody').innerText;}return d;}
function dirty(){capture();$('saved').textContent='Сохранение…';clearTimeout(timer);timer=setTimeout(async()=>{try{if(ready)await pywebview.api.autosave(documents);else localStorage.setItem('orbit',JSON.stringify(documents));$('saved').textContent='Черновик сохранён';}catch(e){$('saved').textContent='Не удалось сохранить черновик';}updateInfo();},500)}
async function switchKind(k){if(k===kind)return;capture();try{if(ready){await pywebview.api.autosave(documents);await pywebview.api.open_editor(k);toast('Открывается отдельное окно '+editorNames[k]);}else{window.open(location.pathname+'#'+k,'_blank');}}catch(e){toast('Не удалось открыть окно: '+e.message)}}
const editorNames={write:'Kalibri Write',sheet:'Kalibri Calc',slides:'Kalibri Slides'};
let splashSeconds=5;
function showSettings(){if(document.getElementById('settingsPanel'))return;const panel=document.createElement('dialog');panel.id='settingsPanel';panel.style.cssText='border:1px solid #dce3ec;border-radius:15px;padding:28px;width:440px;color:#243047;box-shadow:0 20px 80px #152a4540';panel.innerHTML='<h2 style="margin-top:0">Настройки KalibriOffice</h2><label for="splashTime">Длительность заставки (секунды)</label><input id="splashTime" type="number" min="0" max="30" step="1" value="'+splashSeconds+'" style="display:block;width:100%;margin:14px 0;padding:10px;border:1px solid #cbd5e2;border-radius:6px"><p class="hint">По умолчанию 5 секунд. От 0 до 30 секунд.<br>Применится при следующем запуске любого редактора.</p><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px"><button id="cancelSettings">Отмена</button><button class="primary" id="saveSettings">Сохранить</button></div>';document.body.append(panel);panel.onclose=()=>panel.remove();panel.querySelector('#cancelSettings').onclick=()=>panel.close();panel.querySelector('#saveSettings').onclick=async()=>{const value=Number(panel.querySelector('#splashTime').value);if(!Number.isFinite(value)||value<0||value>30)return toast('Выбери от 0 до 30 секунд');try{if(ready){const settings=await pywebview.api.settings(value);splashSeconds=settings.splash_seconds;}else{splashSeconds=value;localStorage.setItem('orbitSplash',String(value));}panel.close();toast('Настройки сохранены');}catch(e){toast('Не удалось сохранить настройки: '+e.message)}};panel.showModal();}

function btn(text,action,cls=''){return `<button class="${cls}" onclick="${action}">${text}</button>`}function group(content,label){return `<div class="group">${content}<label>${label}</label></div>`}
function cleanDocument(html){const doc=new DOMParser().parseFromString(String(html),'text/html');const allowed=new Set(['P','DIV','BR','H1','H2','H3','B','I','U','STRONG','EM','SPAN','FONT','UL','OL','LI','TABLE','TBODY','TR','TD','TH','IMG','A','BLOCKQUOTE']);for(const e of [...doc.body.querySelectorAll('*')]){if(!allowed.has(e.tagName)){e.remove();continue;}for(const a of [...e.attributes]){const ok=(a.name==='style'&&!/url|expression|@import/i.test(a.value))||(e.tagName==='IMG'&&a.name==='src'&&/^data:image\/(png|jpeg|gif|webp);base64,/i.test(a.value))||(e.tagName==='A'&&a.name==='href'&&/^https?:\/\//i.test(a.value))||(['color','face','size'].includes(a.name)&&e.tagName==='FONT');if(!ok)e.removeAttribute(a.name);}}return doc.body.innerHTML;}
function draw(){$('brand').textContent='◉ '+editorNames[kind];document.title=editorNames[kind];document.documentElement.style.setProperty('--accent',kind==='sheet'?'#187b57':kind==='slides'?'#bb4c30':'#315bc6');document.documentElement.style.setProperty('--soft',kind==='sheet'?'#e6f4ed':kind==='slides'?'#fff0e9':'#eaf0ff');$('name').value=documents[kind].name;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));$('tabs').innerHTML=['Файл','Главная','Вставка','Вид'].map(t=>btn(t,`setTab('${t}')`,t===tab?'active':'')).join('');ribbon();
if(kind==='write')$('work').innerHTML=`<article class="page" id="editor" contenteditable="true" spellcheck="true">${documents.write.html}</article>`;
if(kind==='sheet'){let html='<div class="formula"><b id="address">A1</b><span>fx</span><input id="formula" aria-label="Формула ячейки" placeholder="Значение или формула, например =SUM(A1:A5)"></div><div class="gridwrap"><table class="grid"><thead><tr><th></th>';for(let c=0;c<26;c++)html+='<th>'+String.fromCharCode(65+c)+'</th>';html+='</tr></thead><tbody>';for(let r=1;r<=100;r++){html+='<tr><th>'+r+'</th>';for(let c=0;c<26;c++){let a=String.fromCharCode(65+c)+r;html+=`<td tabindex="0" data-a="${a}">${esc(calc(a))}</td>`;}html+='</tr>'}html+='</tbody></table></div>';$('work').innerHTML=html;document.querySelectorAll('[data-a]').forEach(el=>{el.onfocus=()=>select(el.dataset.a);el.ondblclick=()=>{el.contentEditable='true';el.textContent=documents.sheet.cells[el.dataset.a]||'';el.focus()};el.onblur=()=>{if(el.isContentEditable){documents.sheet.cells[el.dataset.a]=el.innerText;el.contentEditable='false';refreshCells();dirty()}};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}else if(!el.isContentEditable&&e.key.length===1&&!e.ctrlKey&&!e.altKey){el.contentEditable='true';el.textContent='';}else if(e.key==='Delete'){documents.sheet.cells[el.dataset.a]='';refreshCells();dirty()}}});$('formula').onchange=()=>{documents.sheet.cells[selected]=$('formula').value;refreshCells();dirty()};select(selected);}
if(kind==='slides')drawSlides();if($('editor'))$('editor').oninput=dirty;updateInfo();}
function setTab(t){capture();tab=t;draw()}
function ribbon(){let html='';if(tab==='Файл')html=group(btn('＋ Новый','newDoc()')+btn('Открыть…','openFile()')+btn('Сохранить проект','save(false)','primary')+btn('Экспорт '+({write:'DOCX',sheet:'XLSX',slides:'PPTX'}[kind]),'save(true)'),'Файлы')+group('<span class="hint">Проект .orbit сохраняет оформление. Экспорт Office переносит базовое содержимое.</span>','Совместимость');
else if(tab==='Вид')html=group(btn('Меньше','zoom(-10)')+btn('100%','zoom(0)')+btn('Больше','zoom(10)')+(kind==='slides'?btn('▶ Показ слайдов','present()','primary'):btn('Печать / PDF','window.print()')),'Масштаб и просмотр');
else if(kind==='write'&&tab==='Главная')html=group(btn('↶','cmd(\'undo\')')+btn('↷','cmd(\'redo\')'),'История')+group(`<select aria-label="Шрифт" onchange="cmd('fontName',this.value)"><option>Calibri</option><option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Consolas</option></select><select aria-label="Размер" onchange="cmd('fontSize',this.value)"><option value="3">12</option><option value="4">16</option><option value="5">24</option><option value="6">32</option><option value="7">48</option></select>`+btn('<b>Ж</b>',"cmd('bold')")+btn('<i>К</i>',"cmd('italic')")+btn('<u>Ч</u>',"cmd('underline')")+`<input type="color" aria-label="Цвет текста" onchange="cmd('foreColor',this.value)">`,'Шрифт')+group(btn('Слева',"cmd('justifyLeft')")+btn('Центр',"cmd('justifyCenter')")+btn('Справа',"cmd('justifyRight')")+btn('Список',"cmd('insertUnorderedList')"),'Абзац')+group(btn('Заголовок',"cmd('formatBlock','h1')")+btn('Подзаголовок',"cmd('formatBlock','h2')")+btn('Текст',"cmd('formatBlock','p')"),'Стили');
else if(kind==='write')html=group(btn('Таблица 3 × 3','insertTable()')+btn('Изображение…',"document.getElementById('imageFile').click()")+btn('Ссылка…','insertLink()')+`<input id="imageFile" type="file" accept="image/*" hidden onchange="insertImage(this)">`,'Вставка');
else if(kind==='sheet')html=group(btn('Σ Сумма','sumColumn()','primary')+btn('Очистить ячейку','clearCell()'),'Данные')+group('<span class="hint">100 строк × 26 столбцов<br>Формулы + − × /, SUM, AVERAGE, MIN, MAX<br>Двойной щелчок — изменить ячейку</span>','Возможности таблицы');
else html=group(btn('＋ Слайд','addSlide()','primary')+btn('Дублировать','duplicateSlide()')+btn('Удалить','deleteSlide()'),'Слайды')+group(`<input type="color" aria-label="Фон слайда" value="${documents.slides.slides[idx].color}" onchange="slideColor(this.value)">`+btn('Синий',"slideColor('#234c75')")+btn('Тёмный',"slideColor('#202737')")+btn('Терракота',"slideColor('#a54734')"),'Оформление')+group(btn('▶ С начала','present()'),'Показ');$('ribbon').innerHTML=html;document.querySelectorAll('#ribbon button').forEach(b=>b.onmousedown=e=>e.preventDefault());}
function cmd(c,v){$('editor')?.focus();document.execCommand(c,false,v);dirty()}
function insertTable(){cmd('insertHTML','<table>'+Array(3).fill('<tr>'+Array(3).fill('<td>Текст</td>').join('')+'</tr>').join('')+'</table><p><br></p>')}
function insertLink(){let u=prompt('Адрес ссылки (https://…)');if(u&&/^https?:\/\//i.test(u))cmd('createLink',u)}
function insertImage(input){let f=input.files[0];if(!f)return;if(f.size>8e6)return toast('Выбери изображение до 8 МБ');let reader=new FileReader();reader.onload=()=>cmd('insertHTML',`<img src="${reader.result}" style="max-width:100%">`);reader.readAsDataURL(f)}
function select(a){selected=a;document.querySelector('.sel')?.classList.remove('sel');document.querySelector(`[data-a="${a}"]`)?.classList.add('sel');$('address').textContent=a;$('formula').value=documents.sheet.cells[a]||'';}
function calc(a,seen=new Set()){let value=documents.sheet.cells[a]||'';if(!value.startsWith('='))return value;if(seen.has(a))return '#ЦИКЛ!';seen=new Set(seen);seen.add(a);let expr=value.slice(1).toUpperCase();try{expr=expr.replace(/(SUM|AVERAGE|MIN|MAX)\(([A-Z]+\d+):([A-Z]+\d+)\)/g,(_,f,x,y)=>{const c1=x.charCodeAt(0),c2=y.charCodeAt(0),r1=+x.slice(1),r2=+y.slice(1);if(c1>c2||r1>r2||r2>100)throw Error();let vals=[];for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){let v=calc(String.fromCharCode(c)+r,seen);if(String(v).startsWith('#'))throw Error();if(v!==''&&!isNaN(Number(v)))vals.push(Number(v))}if(!vals.length)return '0';return f==='SUM'?vals.reduce((a,b)=>a+b,0):f==='AVERAGE'?vals.reduce((a,b)=>a+b,0)/vals.length:f==='MIN'?Math.min(...vals):Math.max(...vals)});expr=expr.replace(/[A-Z]+\d+/g,ref=>{let v=calc(ref,seen);if(v==='' )return '0';if(!Number.isFinite(Number(v)))throw Error();return '('+Number(v)+')'});if(!/^[\d.\s+\-*/()%]+$/.test(expr))return '#ФОРМУЛА!';let result=Function('"use strict";return ('+expr+')')();return Number.isFinite(result)?Math.round(result*1e10)/1e10:'#ДЕЛ/0!';}catch(e){return '#ОШИБКА!'}}
function refreshCells(){document.querySelectorAll('[data-a]').forEach(el=>el.textContent=calc(el.dataset.a));}
function clearCell(){documents.sheet.cells[selected]='';refreshCells();select(selected);dirty()}
function sumColumn(){let col=selected[0],row=+selected.slice(1);if(row<2)return toast('Выбери ячейку под числами');documents.sheet.cells[selected]=`=SUM(${col}1:${col}${row-1})`;refreshCells();select(selected);dirty()}
function drawSlides(){const list=documents.slides.slides,s=list[idx];$('work').innerHTML=`<div class="slides"><aside class="thumbs">${list.map((s,i)=>`<div class="thumb ${i===idx?'active':''}" onclick="chooseSlide(${i})"><small>Слайд ${i+1}</small>${esc(s.title).slice(0,70)||'Без заголовка'}</div>`).join('')}</aside><div class="slideArea"><div class="canvas" style="background:${s.color}"><h1 id="slideTitle" contenteditable="true">${esc(s.title).replace(/\n/g,'<br>')}</h1><div class="body" id="slideBody" contenteditable="true">${esc(s.body)}</div></div></div></div>`;$('slideTitle').oninput=dirty;$('slideBody').oninput=dirty;}
function chooseSlide(i){capture();idx=i;drawSlides();ribbon();updateInfo()}
function addSlide(){capture();documents.slides.slides.splice(idx+1,0,{title:'Новый слайд',body:'Твоя следующая мысль',color:documents.slides.slides[idx].color});idx++;drawSlides();dirty()}
function duplicateSlide(){capture();documents.slides.slides.splice(idx+1,0,{...documents.slides.slides[idx]});idx++;drawSlides();dirty()}
function deleteSlide(){if(documents.slides.slides.length===1)return toast('В презентации должен остаться хотя бы один слайд');documents.slides.slides.splice(idx,1);idx=Math.min(idx,documents.slides.slides.length-1);drawSlides();dirty()}
function slideColor(c){capture();documents.slides.slides[idx].color=c;drawSlides();dirty()}
function present(){capture();let p=idx;const overlay=document.createElement('div');overlay.className='overlay';function render(){let s=documents.slides.slides[p];overlay.innerHTML=`<button class="close">Закрыть (Esc)</button><div class="canvas" style="background:${s.color}"><h1>${esc(s.title).replace(/\n/g,'<br>')}</h1><div class="body">${esc(s.body)}</div></div>`;overlay.querySelector('button').onclick=close;}function close(){overlay.remove();document.removeEventListener('keydown',keys)}function keys(e){if(e.key==='Escape')close();if(['ArrowRight',' ','ArrowLeft'].includes(e.key)){e.preventDefault();p=Math.max(0,Math.min(documents.slides.slides.length-1,p+(e.key==='ArrowLeft'?-1:1)));render()}}overlay.onclick=e=>{if(e.target.tagName!=='BUTTON'){p=Math.min(p+1,documents.slides.slides.length-1);render()}};document.body.append(overlay);document.addEventListener('keydown',keys);render()}
let z=100;function zoom(v){z=v?Math.max(50,Math.min(150,z+v)):100;$('work').style.zoom=z/100;toast('Масштаб '+z+'%')}
function updateInfo(){$('info').textContent=kind==='write'?'Слов: '+($('editor')?.innerText.trim().split(/\s+/).filter(Boolean).length||0):kind==='sheet'?'Лист 1 · Ячеек с данными: '+Object.values(documents.sheet.cells).filter(Boolean).length:`Слайд ${idx+1} из ${documents.slides.slides.length}`;}
async function save(native){capture();if(!ready)return toast('Сохранение файла доступно в приложении KalibriOffice.exe');try{let p=await pywebview.api.save(documents[kind],native);if(p)toast('Сохранено: '+p);}catch(e){toast('Ошибка сохранения: '+e.message)}}
async function openFile(){if(!ready)return toast('Открой настольное приложение для работы с файлами');try{let d=await pywebview.api.open();if(!d)return;if(!['write','sheet','slides'].includes(d.kind))throw Error('Некорректный проект');if(!confirm('Открыть файл вместо текущего документа этого типа? Черновик будет заменён.'))return;if(d.kind==='write')d.html=cleanDocument(d.html);if(d.kind!==kind)return toast('Открой этот файл в отдельном окне '+editorNames[d.kind]);documents[d.kind]=d;idx=0;draw();dirty();}catch(e){toast('Не удалось открыть: '+e.message)}}
function newDoc(){if(!confirm('Создать новый документ? Сначала сохрани нужные изменения.'))return;documents[kind]=kind==='write'?{kind,name:'Новый документ',html:'<p><br></p>'}:kind==='sheet'?{kind,name:'Новая таблица',cells:{}}:{kind,name:'Новая презентация',slides:[{title:'Заголовок',body:'Текст слайда',color:'#234c75'}]};idx=0;draw();dirty()}
$('name').oninput=dirty;document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();save(false)}if(e.ctrlKey&&e.key.toLowerCase()==='o'){e.preventDefault();openFile()}});window.addEventListener('pywebviewready',async()=>{ready=true;try{const config=await pywebview.api.config();kind=config.kind;splashSeconds=config.settings.splash_seconds;let d=await pywebview.api.restore();if(d)for(let k of ['write','sheet','slides'])if(d[k]){if(k==='write')d[k].html=cleanDocument(d[k].html);documents[k]=d[k];}draw();}catch(e){toast('Не удалось восстановить черновик')}});draw();
</script></html>
